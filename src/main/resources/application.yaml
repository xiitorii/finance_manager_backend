spring:
  application:
    name: finance-manager
  datasource:
    url: jdbc:postgresql://postgres:5432/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto : validate
    show-sql: true
    open-in-view: false
  properties:
    hibernate:
      format_sql: true
      dialect: org.hibernate.dialect.PostgreSQLDialect
  server:
    port: 8080
  flyway:
    enabled: true
    clean-disabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  algorithm: HS256